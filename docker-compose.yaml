services:
  backend:
    build: ./backend
    image: flutter-cloud-builder-backend:latest
    ports:
      - "5000:5000"
      # Per-project flutter run -d web-server hot-reload origins. Flutter's
      # debug tooling (DWDS) opens a root-absolute WebSocket on the dev server's
      # own origin, so each project needs a reachable host port. The backend
      # allocates ports in DEV_WEB_PORT_START..+COUNT (dev_server.py).
      - "8100-8131:8100-8131"
    environment:
      # Optional: enable the AI pipeline (read from shell or a root .env file).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Deploy-time secret for session/preview-token signing (must be set).
      FCB_SECRET: ${FCB_SECRET:-}
      # Frontend origin allowlist (comma separated; NO wildcard in prod).
      # Default tracks FRONTEND_PORT (dev) and the prod profile port (3001).
      FCB_ALLOWED_ORIGINS: ${FCB_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://localhost:3001}
    volumes:
      - ./backend:/app
    # Resource limits so one user's build cannot starve the host (Agent 3).
    mem_limit: 6g
    cpus: 3
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:5000/healthz", timeout=5)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Dev frontend: hot reload with bind mount. docker compose --profile dev up
  frontend:
    profiles: ["dev"]
    build:
      context: ./frontend
      target: dev
    image: flutter-cloud-builder-frontend-dev:latest
    ports:
      # Host port is configurable (3000 is taken on some machines):
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Production frontend: standalone Next.js build on a slim runtime.
  # docker compose --profile prod up
  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
      args:
        # NEXT_PUBLIC_* is inlined at build time in next build.
        NEXT_PUBLIC_API_URL: http://localhost:5000
    image: flutter-cloud-builder-frontend-prod:latest
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
