name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Backend unit + contract tests
        working-directory: backend
        run: python -m pytest
      - name: Backend security scan (bandit)
        working-directory: backend
        run: |
          pip install bandit
          bandit -q -ll -r routers workspace.py dev_server.py server.py
      - name: Import smoke (no GEMINI key must still boot)
        working-directory: backend
        run: python -c "import server; print('server imports ok')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build (prod standalone)
        working-directory: frontend
        run: npm run build
      - name: npm audit (fail on high severity)
        working-directory: frontend
        run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker compose config >/dev/null
          docker build ./backend -t fcb-backend:ci
          docker build ./frontend -t fcb-frontend:ci
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fcb-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
